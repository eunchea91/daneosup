<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>단어숲</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500;1,600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --bg:#F2F4EF;
    --surface:#FFFFFF;
    --surface-2:#EAEEE6;
    --ink:#1E2A22;
    --ink-muted:#5C6B60;
    --accent:#1F7A5C;
    --accent-ink:#0E4230;
    --accent-soft:#DBEEE3;
    --accent-soft-strong:#C3E3D3;
    --warn:#B5473A;
    --warn-soft:#F6DEDA;
    --border:#DBDFD3;
    --shadow: 0 1px 2px rgba(30,42,34,.06), 0 8px 24px rgba(30,42,34,.06);
    --radius:16px;
    --font-display:'Newsreader', Georgia, 'Nanum Myeongjo', serif;
    --font-body:'IBM Plex Sans KR', 'Pretendard', system-ui, -apple-system, 'Malgun Gothic', sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141813;
      --surface:#1C221C;
      --surface-2:#232B22;
      --ink:#E9EEE6;
      --ink-muted:#9AAA9C;
      --accent:#54CC9B;
      --accent-ink:#BFF2DA;
      --accent-soft:#1F3A2D;
      --accent-soft-strong:#28503C;
      --warn:#E38578;
      --warn-soft:#3E241F;
      --border:#2B322A;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141813;
    --surface:#1C221C;
    --surface-2:#232B22;
    --ink:#E9EEE6;
    --ink-muted:#9AAA9C;
    --accent:#54CC9B;
    --accent-ink:#BFF2DA;
    --accent-soft:#1F3A2D;
    --accent-soft-strong:#28503C;
    --warn:#E38578;
    --warn-soft:#3E241F;
    --border:#2B322A;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  button, .chip, .task-row, .tab-btn, [data-action]{ touch-action:manipulation; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    margin:0;
    padding-block:0;
  }
  #app-root{
    max-width:640px;
    margin:0 auto;
    padding:0 16px 92px;
    min-height:100vh;
  }
  h1,h2,h3{ font-family:var(--font-display); font-weight:600; text-wrap:balance; margin:0; }
  button{ font-family:inherit; cursor:pointer; }
  input, select{ font-family:inherit; }
  .tabular{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }

  /* header */
  .topbar{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 0 12px;
    background:var(--bg);
  }
  .brand{ display:flex; align-items:baseline; gap:8px; }
  .brand-mark{ font-size:22px; }
  .brand-name{ font-family:var(--font-display); font-size:21px; font-weight:600; letter-spacing:.2px; }
  .icon-btn{
    width:38px; height:38px; border-radius:11px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink-muted); display:flex; align-items:center; justify-content:center;
    font-size:17px;
  }
  .icon-btn:active{ background:var(--surface-2); }

  /* cards / tiles */
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px; box-shadow:var(--shadow);
  }
  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:14px 0; }
  .stat-tile{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:12px 10px; text-align:center; width:100%; font-family:inherit;
  }
  .stat-tile:active{ background:var(--surface-2); }
  .stat-num{ font-size:22px; font-weight:600; color:var(--accent-ink); display:block; }
  .stat-label{ font-size:11.5px; color:var(--ink-muted); margin-top:2px; }

  .task-row{
    display:flex; align-items:center; gap:14px;
    padding:14px; border:1px solid var(--border); border-radius:14px; background:var(--surface);
    margin-bottom:10px; text-align:left; width:100%; box-shadow:var(--shadow);
  }
  .task-row[disabled]{ opacity:.5; }
  .task-icon{
    width:42px; height:42px; border-radius:11px; background:var(--accent-soft); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; font-size:19px; flex:none;
  }
  .task-body{ flex:1; min-width:0; }
  .task-title{ font-weight:600; font-size:15px; }
  .task-sub{ font-size:12.5px; color:var(--ink-muted); margin-top:2px; }
  .task-badge{
    font-family:var(--font-mono); font-size:13px; font-weight:600; color:var(--accent-ink);
    background:var(--accent-soft); border-radius:999px; padding:3px 10px; flex:none;
  }

  .section-label{
    font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-muted);
    margin:22px 0 10px; font-weight:600;
  }

  /* bottom nav */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    background:var(--surface); border-top:1px solid var(--border);
    display:flex; justify-content:center;
  }
  .tabbar-inner{ display:flex; width:100%; max-width:640px; }
  .tab-btn{
    flex:1; background:none; border:none; padding:9px 2px 10px; display:flex; flex-direction:column;
    align-items:center; gap:3px; color:var(--ink-muted); font-size:11px; font-weight:500;
  }
  .tab-btn .tab-ic{ font-size:19px; }
  .tab-btn.active{ color:var(--accent-ink); }
  .tab-btn .dot{
    position:absolute; margin-left:14px; margin-top:-2px; width:7px; height:7px; border-radius:50%; background:var(--warn);
  }
  .tab-btn-wrap{ position:relative; flex:1; display:flex; }

  /* flashcard */
  .flip-scene{ perspective:1200px; margin:18px 0 8px; }
  .flip-card{
    position:relative; width:100%; min-height:260px; border-radius:20px;
    transform-style:preserve-3d; transition:transform .45s cubic-bezier(.2,.8,.2,1);
  }
  .flip-card.flipped{ transform:rotateY(180deg); }
  .flip-face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:20px;
    border:1px solid var(--border); background:var(--surface); box-shadow:var(--shadow);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    padding:28px 22px;
  }
  .flip-face.back{ transform:rotateY(180deg); background:var(--accent-soft); }
  .flip-word{ font-family:var(--font-display); font-style:italic; font-size:34px; font-weight:600; }
  .flip-pos{ margin-top:10px; font-size:12.5px; color:var(--ink-muted); background:var(--surface-2); padding:3px 10px; border-radius:999px; }
  .flip-meaning{ font-family:var(--font-display); font-size:24px; font-weight:600; color:var(--accent-ink); }
  .flip-example{ margin-top:14px; font-size:13.5px; color:var(--ink-muted); line-height:1.55; max-width:38ch; }
  .flip-example-ko{ font-size:12px; color:var(--ink-muted); opacity:.8; display:inline-block; margin-top:4px; }
  .flip-hint{ margin-top:16px; font-size:11.5px; color:var(--ink-muted); }

  .progress-track{ height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden; margin:14px 0; }
  .progress-fill{ height:100%; background:var(--accent); border-radius:999px; transition:width .3s ease; }

  .btn{
    border-radius:12px; padding:13px 18px; font-weight:600; font-size:14.5px; border:1px solid transparent;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary[disabled]{ opacity:.45; }
  .btn-secondary{ background:var(--surface); border-color:var(--border); color:var(--ink); }
  .btn-ghost{ background:none; border:none; color:var(--accent-ink); font-weight:600; }
  .btn-danger{ background:none; border:1px solid var(--warn); color:var(--warn); }
  .btn-row{ display:flex; gap:10px; margin-top:16px; }
  .btn-row .btn{ flex:1; }
  .btn-block{ width:100%; }

  .empty-state{ text-align:center; padding:52px 16px; color:var(--ink-muted); }
  .empty-state .big{ font-size:38px; margin-bottom:10px; }
  .empty-state h3{ color:var(--ink); margin-bottom:6px; }

  /* quiz */
  .quiz-progress{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .quiz-progress span{ font-size:12.5px; color:var(--ink-muted); }
  .quiz-prompt-card{
    background:var(--surface); border:1px solid var(--border); border-radius:20px; box-shadow:var(--shadow);
    padding:34px 22px; text-align:center; margin:14px 0 18px;
  }
  .quiz-kicker{ font-size:11.5px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px; }
  .quiz-prompt{ font-family:var(--font-display); font-size:28px; font-weight:600; }
  .quiz-prompt.is-meaning{ font-style:italic; color:var(--accent-ink); font-size:23px; }
  .choice-list{ display:flex; flex-direction:column; gap:9px; }
  .choice-btn{
    text-align:left; padding:13px 15px; border-radius:12px; border:1px solid var(--border);
    background:var(--surface); font-size:14.5px; color:var(--ink);
  }
  .choice-btn.correct{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink); }
  .choice-btn.wrong{ background:var(--warn-soft); border-color:var(--warn); color:var(--warn); }
  .choice-btn[disabled]{ opacity:.75; }
  .typing-row{ display:flex; gap:9px; }
  .typing-row input{
    flex:1; padding:13px 14px; border-radius:12px; border:1px solid var(--border); background:var(--surface);
    color:var(--ink); font-size:15px;
  }
  .typing-row input.correct{ border-color:var(--accent); background:var(--accent-soft); }
  .typing-row input.wrong{ border-color:var(--warn); background:var(--warn-soft); }
  .feedback-line{ margin-top:12px; font-size:13.5px; text-align:center; }
  .feedback-line.correct{ color:var(--accent-ink); }
  .feedback-line.wrong{ color:var(--warn); }

  .result-row{
    display:flex; align-items:center; gap:10px; padding:11px 4px; border-bottom:1px solid var(--border);
    font-size:13.5px;
  }
  .result-row:last-child{ border-bottom:none; }
  .result-mark{ width:20px; flex:none; font-weight:700; }
  .result-mark.correct{ color:var(--accent-ink); }
  .result-mark.wrong{ color:var(--warn); }

  /* word list */
  .search-row{ display:flex; gap:8px; margin-bottom:10px; }
  .search-row input{
    flex:1; padding:11px 13px; border-radius:11px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:14px;
  }
  .filter-chips{ display:flex; gap:7px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px; }
  .chip{
    flex:none; padding:7px 13px; border-radius:999px; border:1px solid var(--border); background:var(--surface);
    font-size:12.5px; color:var(--ink-muted); white-space:nowrap;
  }
  .chip.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .word-item{
    display:flex; align-items:center; gap:10px; padding:12px 4px; border-bottom:1px solid var(--border);
  }
  .word-item .w{ font-weight:600; font-size:14.5px; }
  .word-item .m{ font-size:12.5px; color:var(--ink-muted); }
  .word-item .meta{ flex:1; min-width:0; }
  .cat-tag{ font-size:10.5px; color:var(--accent-ink); background:var(--accent-soft); border-radius:999px; padding:2px 8px; margin-left:2px; }
  .wrong-tag{ font-size:10.5px; color:var(--warn); background:var(--warn-soft); border-radius:999px; padding:2px 8px; margin-left:2px; font-weight:600; }
  .badge{ font-size:10.5px; padding:3px 8px; border-radius:999px; flex:none; font-weight:600; }
  .badge.new{ background:var(--surface-2); color:var(--ink-muted); }
  .badge.learning{ background:#FBEBC7; color:#8A6113; }
  .badge.review{ background:var(--accent-soft); color:var(--accent-ink); }
  .badge.mastered{ background:var(--accent); color:#fff; }
  .del-btn{ background:none; border:none; color:var(--ink-muted); font-size:16px; flex:none; padding:4px 6px; }
  .star-btn{ background:none; border:none; color:#D4A017; font-size:19px; flex:none; padding:4px 6px; line-height:1; }
  .speak-btn{ background:none; border:none; color:var(--accent-ink); font-size:14px; flex:none; padding:2px 4px; vertical-align:middle; line-height:1; }
  .flip-star{ position:absolute; top:14px; right:16px; font-size:22px; }

  .form-grid{ display:flex; flex-direction:column; gap:10px; margin:12px 0 16px; }
  .form-grid input, .form-grid select, .form-grid textarea{
    padding:11px 13px; border-radius:11px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:14px; width:100%;
  }
  .form-grid textarea{ resize:vertical; min-height:56px; font-family:inherit; }
  label.field-label{ font-size:12px; color:var(--ink-muted); margin-bottom:2px; display:block; }

  .settings-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--border); gap:12px; }
  .settings-row:last-of-type{ border-bottom:none; }
  .settings-row .lbl{ font-weight:600; font-size:14px; }
  .settings-row .hint{ font-size:12px; color:var(--ink-muted); margin-top:2px; }
  .num-stepper{ display:flex; align-items:center; gap:10px; }
  .num-stepper button{
    width:32px; height:32px; border-radius:9px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:17px;
  }
  .num-stepper .val{ font-family:var(--font-mono); font-size:16px; min-width:26px; text-align:center; }

  .streak-pill{
    display:inline-flex; align-items:center; gap:6px; background:var(--accent-soft); color:var(--accent-ink);
    border-radius:999px; padding:6px 12px; font-size:12.5px; font-weight:600; margin-bottom:4px;
  }
  .mode-note{ font-size:11px; color:var(--ink-muted); text-align:center; margin-top:18px; }

  .modal-overlay{
    position:fixed; inset:0; z-index:50; background:rgba(20,24,19,.45);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-card{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    box-shadow:var(--shadow); padding:20px; width:100%; max-width:320px;
  }
  .modal-msg{ font-size:14.5px; line-height:1.5; margin:0 0 4px; }

  #debug-error-banner{
    position:fixed; left:8px; right:8px; top:8px; z-index:999;
    background:#B5473A; color:#fff; border-radius:10px; padding:10px 12px;
    font-size:12px; font-family:monospace; white-space:pre-wrap; word-break:break-all;
    max-height:40vh; overflow:auto; box-shadow:0 4px 16px rgba(0,0,0,.3);
  }
  #debug-error-banner button{
    display:block; margin-top:8px; background:#fff; color:#B5473A; border:none;
    border-radius:6px; padding:4px 10px; font-weight:600; font-size:12px;
  }
</style>

<div id="debug-error-banner" hidden></div>
<div id="app-root"></div>
<div id="modal-root"></div>

<script>
(function(){
  "use strict";

  (function(){
    var banner = document.getElementById("debug-error-banner");
    function show(text){
      banner.textContent = text;
      var btn = document.createElement("button");
      btn.textContent = "닫기";
      btn.onclick = function(){ banner.hidden = true; };
      banner.appendChild(btn);
      banner.hidden = false;
    }
    window.addEventListener("error", function(e){
      show("JS 에러: " + e.message + "\n(" + (e.filename||"") + ":" + e.lineno + ":" + e.colno + ")");
    });
    window.addEventListener("unhandledrejection", function(e){
      var r = e.reason;
      show("처리 안 된 Promise 에러: " + (r && (r.message || r) || r));
    });
  })();

  var SRS_INTERVALS = [1,2,4,7,14,30];
  var DAILY_MIN = 3, DAILY_MAX = 30;

  var CATEGORY_LABELS = {
    cognition:"사고·인지", action:"행동·실행", change:"변화·과정",
    trait:"성질·특성", relation:"관계·감정",
    nature:"자연·생물", society:"사회·제도", body:"신체·건강",
    academic:"학문·분야", object:"사물·일상"
  };
  var CATEGORY_ORDER = ["cognition","action","change","trait","relation","nature","society","body","academic","object"];

  var DEFAULT_WORDS = [
    ["abandon","동","버리다, 포기하다","He had to abandon the sinking ship.","action","그는 침몰하는 배를 버려야 했다."],
    ["abundant","형","풍부한","The region has abundant natural resources.","trait","그 지역은 천연자원이 풍부하다."],
    ["accomplish","동","성취하다, 해내다","She accomplished all her goals this year.","action","그녀는 올해 모든 목표를 달성했다."],
    ["accurate","형","정확한","The report gave an accurate account of events.","trait","그 보고서는 사건에 대해 정확한 설명을 제공했다."],
    ["acknowledge","동","인정하다","He acknowledged his mistake immediately.","cognition","그는 즉시 자신의 실수를 인정했다."],
    ["adapt","동","적응하다","Animals adapt to their environment over time.","change","동물은 시간이 지나면서 환경에 적응한다."],
    ["adequate","형","충분한, 적절한","We need adequate supplies for the trip.","trait","우리는 여행을 위한 충분한 물품이 필요하다."],
    ["adjust","동","조정하다, 적응하다","It took a while to adjust to the new schedule.","action","새 일정에 적응하는 데 시간이 좀 걸렸다."],
    ["advocate","동","옹호하다, 지지하다","She advocates for children's education.","relation","그녀는 아동 교육을 옹호한다."],
    ["ambiguous","형","모호한","His answer was deliberately ambiguous.","cognition","그의 대답은 의도적으로 모호했다."],
    ["analyze","동","분석하다","Scientists analyzed the data carefully.","cognition","과학자들은 데이터를 신중하게 분석했다."],
    ["anticipate","동","예상하다, 기대하다","We anticipate strong sales next quarter.","cognition","우리는 다음 분기에 높은 매출을 예상한다."],
    ["apparent","형","명백한, 겉보기의","It became apparent that he was lying.","cognition","그가 거짓말을 하고 있다는 것이 명백해졌다."],
    ["appreciate","동","감사하다, 진가를 알아보다","I really appreciate your help.","relation","당신의 도움에 정말 감사합니다."],
    ["approach","동","접근하다","We need a new approach to this problem.","action","우리는 이 문제에 대한 새로운 접근법이 필요하다."],
    ["appropriate","형","적절한","Wear appropriate clothing for the weather.","trait","날씨에 맞는 적절한 옷을 입어라."],
    ["arbitrary","형","임의의, 자의적인","The rule seemed completely arbitrary.","trait","그 규칙은 완전히 임의적으로 보였다."],
    ["artificial","형","인공적인","The drink contains artificial flavoring.","trait","그 음료에는 인공 향료가 들어 있다."],
    ["assemble","동","조립하다, 모으다","Workers assemble the cars on the line.","action","작업자들은 라인에서 자동차를 조립한다."],
    ["assert","동","주장하다","She asserted her right to speak.","relation","그녀는 말할 권리를 주장했다."],
    ["assess","동","평가하다","Teachers assess student progress regularly.","cognition","교사들은 학생의 진도를 정기적으로 평가한다."],
    ["assume","동","가정하다, 추정하다","Don't assume he already knows.","cognition","그가 이미 알고 있다고 가정하지 마라."],
    ["attain","동","달성하다","She attained her degree after four years.","action","그녀는 4년 후에 학위를 취득했다."],
    ["attribute","동","~탓으로 돌리다","He attributes his success to hard work.","cognition","그는 자신의 성공을 노력의 결과로 본다."],

  /* ---------- utilities ---------- */
  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function addDays(dateStr, n){
    var parts=dateStr.split("-").map(Number);
    var d=new Date(parts[0], parts[1]-1, parts[2]);
    d.setDate(d.getDate()+n);
    return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  }
  function shuffle(arr){
    var a=arr.slice();
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function slugify(word){
    return word.toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"") || "word";
  }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function speak(text){
    try{
      if(!text || !("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  var wordFilter = "all";
  var wordCategoryFilter = "all";

  var root = document.getElementById("app-root");

  /* ---------- persistence ---------- */
  function localSave(){
    try{
      localStorage.setItem("vocabforest_words", JSON.stringify(words));
      localStorage.setItem("vocabforest_progress", JSON.stringify(progress));
      localStorage.setItem("vocabforest_settings", JSON.stringify(settings));
    }catch(e){}
  }

  function persistWord(id, data){
    if(mode==="db"){ db.collection("words").doc(id).set(data).catch(function(){}); }
    else localSave();
  }
  function persistProgressDoc(id, data){
    if(mode==="db"){ db.collection("progress").doc(id).set(data).catch(function(){}); }
    else localSave();
  }
  function deleteWordRemote(id){
    if(mode==="db"){
      db.collection("words").doc(id).delete().catch(function(){});
      db.collection("progress").doc(id).delete().catch(function(){});
    } else localSave();
  }
  function persistSettings(){
    if(mode==="db"){ db.doc("settings/main").set(settings).catch(function(){}); }
    else localSave();
  }

  function seedLocalDefaults(){
    var order=0;
    DEFAULT_WORDS.forEach(function(w){
      var id=slugify(w[0]);
      words[id]={ word:w[0], pos:w[1], meaning:w[2], example:w[3], category:w[4]||"trait", exampleKo:w[5]||"", source:"default", order:order++ };
    });
  }

  function loadAll(){
    mode="local"; fallbackInit();
    return Promise.resolve();
  }

  function fallbackInit(){
    try{
      var w=JSON.parse(localStorage.getItem("vocabforest_words")||"null");
      var p=JSON.parse(localStorage.getItem("vocabforest_progress")||"null");
      var s=JSON.parse(localStorage.getItem("vocabforest_settings")||"null");
      words = w || {};
      progress = p || {};
      settings = s || {dailyCount:10,lastBatchDate:"",todaysBatchIds:[],activityDates:[]};
      if(!w || Object.keys(w).length===0){ seedLocalDefaults(); localSave(); }
    }catch(e){
      seedLocalDefaults();
      settings = {dailyCount:10,lastBatchDate:"",todaysBatchIds:[],activityDates:[]};
    }
  }

  /* ---------- domain logic ---------- */
  function wordList(){
    return Object.keys(words).map(function(id){ return Object.assign({id:id}, words[id]); });
  }
  function sortedWords(){
    return wordList().sort(function(a,b){ return (a.order||0)-(b.order||0); });
  }
  function statusOf(id){
    var p=progress[id];
    return p ? p.status : "new";
  }
  function maxOrder(){
    var m=-1;
    wordList().forEach(function(w){ if((w.order||0)>m) m=w.order||0; });
    return m;
  }

  function ensureTodayBatch(){
    var t=todayStr();
    if(settings.lastBatchDate===t) return;
    var candidates = shuffle(wordList().filter(function(w){ return !progress[w.id]; }));
    var batch = candidates.slice(0, settings.dailyCount||10);
    batch.forEach(function(w){
      progress[w.id]={
        status:"learning", srsLevel:0, nextReviewAt:null, lastResult:null,
        correctCount:0, wrongCount:0, firstSeenAt:t, lastSeenAt:t, seen:false
      };
      persistProgressDoc(w.id, progress[w.id]);
    });
    settings.lastBatchDate=t;
    settings.todaysBatchIds=batch.map(function(w){ return w.id; });
    persistSettings();
  }

  function markCardSeen(id){
    var p=progress[id];
    if(p && !p.seen){
      p.seen=true;
      persistProgressDoc(id, p);
    }
  }

  function recordActivity(){
    var t=todayStr();
    if(settings.activityDates.indexOf(t)===-1){
      settings.activityDates.push(t);
      if(settings.activityDates.length>400) settings.activityDates=settings.activityDates.slice(-400);
      persistSettings();
    }
  }

  function currentStreak(){
    var set={}; settings.activityDates.forEach(function(d){ set[d]=true; });
    var t=todayStr();
    var streak=0;
    var cursor = set[t] ? t : addDays(t,-1);
    if(!set[cursor]) return 0;
    while(set[cursor]){ streak++; cursor=addDays(cursor,-1); }
    return streak;
  }

  function counts(){
    var total=0, learning=0, review=0, mastered=0, dueReview=0;
    var t=todayStr();
    wordList().forEach(function(w){
      total++;
      var p=progress[w.id];
      if(!p) return;
      if(p.status==="learning") learning++;
      else if(p.status==="review"){ review++; if(p.nextReviewAt && p.nextReviewAt<=t) dueReview++; }
      else if(p.status==="mastered") mastered++;
    });
    return {total:total, learning:learning, review:review, mastered:mastered, dueReview:dueReview};
  }

  function buildPool(kind){
    var t=todayStr();
    return wordList().filter(function(w){
      var p=progress[w.id];
      if(!p) return false;
      if(kind==="quiz") return p.status==="learning";
      return p.status==="review" && p.nextReviewAt && p.nextReviewAt<=t;
    }).map(function(w){ return w.id; });
  }

  function buildQuestion(id){
    var w=words[id];
    var format = Math.random()<0.5 ? "mcq" : "typing";
    if(format==="mcq"){
      var pool = wordList().filter(function(x){ return x.id!==id; });
      var distractors = shuffle(pool).slice(0,3).map(function(x){ return x.meaning; });
      var choices = shuffle([w.meaning].concat(distractors));
      return {id:id, format:"mcq", word:w.word, pos:w.pos, choices:choices, answer:w.meaning};
    }
    return {id:id, format:"typing", word:w.word, meaning:w.meaning, answer:w.word};
  }

  function startSession(kind, idsOverride){
    var ids = idsOverride || buildPool(kind);
    var count = Math.min(10, ids.length);
    var chosen = shuffle(ids).slice(0,count);
    quizSession = {
      kind:kind,
      questions: chosen.map(buildQuestion),
      index:0, answers:[], awaitingNext:false, done:false
    };
    route=kind;
  }

  function applyResult(id, correct){
    var p=progress[id];
    if(!p) return;
    var t=todayStr();
    if(quizSession.kind==="quiz"){
      if(correct){
        p.status="review"; p.srsLevel=0; p.nextReviewAt=addDays(t,SRS_INTERVALS[0]); p.correctCount++;
      } else {
        p.wrongCount++;
      }
    } else {
      if(correct){
        var nl=(p.srsLevel||0)+1;
        if(nl>=SRS_INTERVALS.length){ p.status="mastered"; p.srsLevel=SRS_INTERVALS.length; p.nextReviewAt=null; }
        else { p.srsLevel=nl; p.nextReviewAt=addDays(t,SRS_INTERVALS[nl]); }
        p.correctCount++;
      } else {
        p.srsLevel=0; p.nextReviewAt=addDays(t,1); p.wrongCount++;
      }
    }
    p.lastResult = correct ? "correct" : "wrong";
    p.lastSeenAt=t;
    persistProgressDoc(id, p);
    recordActivity();
  }

  function submitAnswer(value){
    var q=quizSession.questions[quizSession.index];
    var correct = q.format==="mcq" ? value===q.answer : value.trim().toLowerCase()===q.answer.trim().toLowerCase();
    quizSession.answers.push(Object.assign({}, q, {given:value, correct:correct}));
    applyResult(q.id, correct);
    quizSession.awaitingNext=true;
    render();
  }

  function nextQuestion(){
    quizSession.index++;
    quizSession.awaitingNext=false;
    if(quizSession.index>=quizSession.questions.length) quizSession.done=true;
    render();
  }

  function initSample(){
    if(typeof claude==="undefined" || !claude || typeof claude.use!=="function") return;
    claude.use("sample").then(function(s){
      sampleFn = s;
      if(sampleFn && route==="words" && wordFormOpen) render();
    }).catch(function(){ sampleFn = null; });
  }

  function autofillErrorMessage(code){
    if(code==="not_granted") return "자동 채우기 권한이 허용되지 않았어요.";
    if(code==="rate_limited") return "요청이 많아요. 잠시 후 다시 시도해주세요.";
    if(code==="cancelled") return "";
    return "자동 채우기에 실패했어요. 다시 시도해주세요.";
  }

  function handleAutofillWord(btn){
    var wordEl = document.getElementById("newWordInput");
    var msgEl = document.getElementById("autoFillMsg");
    var w = (wordEl && wordEl.value || "").trim();
    if(!w){
      if(msgEl) msgEl.textContent = "영단어를 먼저 입력해주세요.";
      return;
    }
    if(!sampleFn || (btn && btn.disabled)) return;
    btn.disabled = true;
    btn.textContent = "생성 중...";
    if(msgEl) msgEl.textContent = "";
    var prompt = '다음 영단어의 한국어 단어 학습카드 정보를 만들어줘: "'+w+'"\n' +
      '아래 JSON 형식으로만 답해, 다른 설명은 절대 붙이지 마:\n' +
      '{"pos":"명 또는 동 또는 형 또는 부 또는 기타 중 하나","meaning":"간결한 한국어 뜻(여러 뜻은 쉼표로 나열)","example":"이 단어를 사용한 쉬운 영어 예문 한 문장","exampleKo":"그 예문의 자연스러운 한국어 번역","category":"cognition, action, change, trait, relation, nature, society, body, academic, object 중 이 단어에 가장 잘 맞는 하나"}';
    sampleFn.json(prompt, {modelTier:"quick"}).then(function(data){
      btn.disabled = false;
      btn.textContent = "✨ 자동 채우기";
      if(!data || typeof data!=="object"){
        if(msgEl) msgEl.textContent = "자동 채우기에 실패했어요. 다시 시도해주세요.";
        return;
      }
      var posEl = document.getElementById("newPosInput");
      var meaningEl = document.getElementById("newMeaningInput");
      var exEl = document.getElementById("newExampleInput");
      var exKoEl = document.getElementById("newExampleKoInput");
      var catEl = document.getElementById("newCategoryInput");
      var validPos = ["명","동","형","부","기타"];
      if(posEl && validPos.indexOf(data.pos)!==-1) posEl.value = data.pos;
      if(meaningEl && data.meaning) meaningEl.value = String(data.meaning);
      if(exEl && data.example) exEl.value = String(data.example);
      if(exKoEl && data.exampleKo) exKoEl.value = String(data.exampleKo);
      if(catEl && CATEGORY_LABELS[data.category]) catEl.value = data.category;
    }).catch(function(e){
      btn.disabled = false;
      btn.textContent = "✨ 자동 채우기";
      if(msgEl) msgEl.textContent = autofillErrorMessage(e && e.code);
    });
  }

  function addWordFromForm(){
    var wordEl=document.getElementById("newWordInput");
    var meaningEl=document.getElementById("newMeaningInput");
    var posEl=document.getElementById("newPosInput");
    var exEl=document.getElementById("newExampleInput");
    var exKoEl=document.getElementById("newExampleKoInput");
    var catEl=document.getElementById("newCategoryInput");
    var wordVal=(wordEl.value||"").trim();
    var meaningVal=(meaningEl.value||"").trim();
    if(!wordVal || !meaningVal){ wordFormError="영단어와 뜻을 모두 입력해주세요."; render(); return; }
    var dup = wordList().some(function(w){ return w.word.trim().toLowerCase()===wordVal.toLowerCase(); });
    if(dup){ wordFormError='"'+wordVal+'"은(는) 이미 단어장에 있어요.'; render(); return; }
    wordFormError="";
    var id=slugify(wordVal);
    if(words[id]) id=id+"-"+Date.now().toString(36).slice(-4);
    var entry={ word:wordVal, pos:posEl.value||"기타", meaning:meaningVal, example:(exEl.value||"").trim(), exampleKo:(exKoEl&&exKoEl.value||"").trim(), category:(catEl&&catEl.value)||"trait", source:"custom", order:maxOrder()+1 };
    words[id]=entry;
    persistWord(id, entry);
    wordFormOpen=false;
    render();
  }

  function toggleStar(id){
    if(!words[id]) return;
    words[id].starred = !words[id].starred;
    persistWord(id, words[id]);
    render();
  }

  function deleteWord(id){
    if(!words[id] || words[id].source!=="custom") return;
    pendingConfirm={ message:'"'+words[id].word+'" 단어를 삭제할까요?', onConfirm:function(){
      delete words[id];
      delete progress[id];
      deleteWordRemote(id);
      render();
    }};
    render();
  }

  function resetProgress(){
    Object.keys(progress).forEach(function(id){
      if(mode==="db") db.collection("progress").doc(id).delete().catch(function(){});
    });
    progress={};
    settings.lastBatchDate="";
    settings.todaysBatchIds=[];
    persistSettings();
    if(mode!=="db") localSave();
    ensureTodayBatch();
    route="home";
    render();
  }

  /* ---------- rendering ---------- */
  function statusBadge(status){
    var label = status==="new" ? "신규" : status==="learning" ? "학습중" : status==="review" ? "복습중" : "완료";

      '</div>';
  }

  function renderTabbar(){
    var c=counts();

      {r:"home", ic:"⌂", label:"홈"},
      {r:"learn", ic:"✎", label:"학습"},

            '<span class="tab-ic">'+t.ic+'</span><span>'+t.label+'</span>' +
          '</button>' +
          (t.dot? '<span class="dot"></span>' : '') +
        '</div>';

  function renderSession(){
    var kindLabel = quizSession.kind==="quiz" ? "단어 퀴즈" : "오늘의 복습";
    var html = renderTopbar(kindLabel);
    html += '<div>';

    if(quizSession.done){
      var correctCount=quizSession.answers.filter(function(a){ return a.correct; }).length;
      var total=quizSession.answers.length;
      var wrongIds=quizSession.answers.filter(function(a){ return !a.correct; }).map(function(a){ return a.id; });
      html += '<div class="card" style="text-align:center;">' +
        '<h2>'+correctCount+' / '+total+' 정답</h2>' +
        '<p style="color:var(--ink-muted);font-size:13.5px;">'+(correctCount===total?"완벽해요!":"틀린 단어는 계속 복습 목록에 남아있어요.")+'</p>' +
      '</div>';
      html += '<div class="section-label">결과</div>';
      html += '<div class="card">' + quizSession.answers.map(function(a){
        var w=words[a.id];
        return '<div class="result-row"><span class="result-mark '+(a.correct?"correct":"wrong")+'">'+(a.correct?"O":"X")+'</span>' +
          '<span>'+esc(w?w.word:"")+' — '+esc(w?w.meaning:"")+'</span></div>';
      }).join("") + '</div>';
      html += '<div class="btn-row">';
      if(wrongIds.length>0){
        html += '<button class="btn btn-secondary" data-action="retry-wrong">틀린 문제만 다시</button>';
      }
      html += '<button class="btn btn-primary" data-action="finish-session">홈으로</button>';
      html += '</div>';
      html += '</div>';
      return html;
    }

    var q=quizSession.questions[quizSession.index];
    var pct=Math.round((quizSession.index/quizSession.questions.length)*100);
    html += '<div class="quiz-progress"><span>'+(quizSession.index+1)+' / '+quizSession.questions.length+'</span><span>'+(q.format==="mcq"?"객관식":"주관식")+'</span></div>';
    html += '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>';

    html += '<div class="quiz-prompt-card">';
    if(q.format==="mcq"){
      html += '<div class="quiz-kicker">이 단어의 뜻은?</div><div class="quiz-prompt">'+esc(q.word)+' <button type="button" class="speak-btn" data-action="speak" data-word="'+esc(q.word)+'" aria-label="발음 듣기">🔊</button></div>';
    } else {
      html += '<div class="quiz-kicker">이 뜻에 맞는 영단어는?</div><div class="quiz-prompt is-meaning">'+esc(q.meaning)+'</div>';
    }
    html += '</div>';

    var answered = quizSession.awaitingNext;
    var lastAnswer = answered ? quizSession.answers[quizSession.answers.length-1] : null;

    if(q.format==="mcq"){
      html += '<div class="choice-list">' + q.choices.map(function(choice){
        var cls="choice-btn";
        if(answered){
          if(choice===q.answer) cls+=" correct";
          else if(choice===lastAnswer.given) cls+=" wrong";
        }
        return '<button class="'+cls+'"'+(answered?" disabled":"")+' data-action="answer-mcq" data-value="'+esc(choice)+'">'+esc(choice)+'</button>';
      }).join("") + '</div>';
    } else {
      var cls = answered ? (lastAnswer.correct ? "correct" : "wrong") : "";
      html += '<form id="typingForm" class="typing-row">' +
        '<input id="typingInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="영단어를 입력하세요" class="'+cls+'"'+(answered?" disabled":"")+' value="'+(answered?esc(lastAnswer.given):"")+'">' +
        (answered? '' : '<button type="submit" class="btn btn-primary">확인</button>') +
      '</form>';
      if(answered && !lastAnswer.correct){
        html += '<div class="feedback-line wrong">정답: '+esc(q.answer)+'</div>';
      } else if(answered){
        html += '<div class="feedback-line correct">정답이에요!</div>';
      }
    }

    if(answered){
      html += '<div class="btn-row"><button class="btn btn-primary btn-block" data-action="next-question">'+(quizSession.index+1<quizSession.questions.length?"다음 문제":"결과 보기")+'</button></div>';
    }

    html += '</div>';
    return html;
  }

  function wordListItemsHtml(){
    var q=wordSearch.trim().toLowerCase();
    var base = wordFilter==="wrong" ?
      sortedWords().sort(function(a,b){
        var wa=(progress[a.id]&&progress[a.id].wrongCount)||0;
        var wb=(progress[b.id]&&progress[b.id].wrongCount)||0;
        return wb-wa;
      }) : sortedWords();
    var items = base.filter(function(w){
      if(wordFilter==="starred"){
        if(!w.starred) return false;
      } else if(wordFilter==="wrong"){
        var wc=(progress[w.id]&&progress[w.id].wrongCount)||0;
        if(wc<=0) return false;
      } else {
        var st=statusOf(w.id);
        if(wordFilter!=="all" && st!==wordFilter) return false;
      }
      if(wordCategoryFilter!=="all" && (w.category||"trait")!==wordCategoryFilter) return false;
      if(q && w.word.toLowerCase().indexOf(q)===-1 && w.meaning.indexOf(q)===-1) return false;
      return true;
    });
    if(items.length===0){
      var emptyMsg = wordFilter==="starred" ? "즐겨찾기한 단어가 없어요." :
        wordFilter==="wrong" ? "아직 틀린 단어가 없어요." : "조건에 맞는 단어가 없어요.";
      return '<div class="empty-state"><div class="big">🔍</div><p>'+emptyMsg+'</p></div>';
    }
    return '<div class="card">' + items.map(function(w){
      var st=statusOf(w.id);
      var catLabel = CATEGORY_LABELS[w.category] || "";
      var wrongCount=(progress[w.id]&&progress[w.id].wrongCount)||0;
      return '<div class="word-item">' +
        '<button type="button" class="star-btn" data-action="toggle-star" data-id="'+esc(w.id)+'" aria-label="즐겨찾기">'+(w.starred?"★":"☆")+'</button>' +
        '<div class="meta"><span class="w">'+esc(w.word)+'</span> <button type="button" class="speak-btn" data-action="speak" data-word="'+esc(w.word)+'" aria-label="발음 듣기">🔊</button> <span class="m">'+esc(w.meaning)+'</span>' +
        (catLabel? ' <span class="cat-tag">'+esc(catLabel)+'</span>' : '') +
        (wrongCount>0? ' <span class="wrong-tag">✕'+wrongCount+'</span>' : '') + '</div>' +
        statusBadge(st) +
        (w.source==="custom" ? '<button class="del-btn" data-action="delete-word" data-id="'+esc(w.id)+'" aria-label="삭제">✕</button>' : '') +
      '</div>';
    }).join("") + '</div>';
  }

  function render(){
    var html;
    if(mode==="loading"){
      root.innerHTML = '<div class="empty-state"><h3>단어숲을 불러오는 중...</h3></div>';
      return;
    }
    if(route==="home") html=renderHome();
    else if(route==="learn") html=renderLearn();
    else if(route==="quiz") html = quizSession && quizSession.kind==="quiz" ? renderSession() : renderQuizOrReview("quiz");
    else if(route==="review") html = quizSession && quizSession.kind==="review" ? renderSession() : renderQuizOrReview("review");
    else if(route==="words") html=renderWordsHeader();
    else if(route==="settings") html=renderSettings();
    else html=renderHome();

    html += renderTabbar();
    root.innerHTML = html;

    var modalRoot=document.getElementById("modal-root");
    if(modalRoot) modalRoot.innerHTML = pendingConfirm ? renderConfirmModal() : "";

    if(route==="words"){
      document.getElementById("wordListContainer").innerHTML = wordListItemsHtml();
      var si=document.getElementById("wordSearchInput");
      if(si){
        si.focus();
        var v=si.value; si.value=""; si.value=v;
      }
    }

    if((route==="quiz"||route==="review") && quizSession && !quizSession.done){
      var curQ=quizSession.questions[quizSession.index];
      if(curQ && curQ.format==="typing" && !quizSession.awaitingNext){
        var ti=document.getElementById("typingInput");
        if(ti) ti.focus();
      }
    }
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action=el.dataset.action;
    if(action==="nav"){
      if(route==="learn"){
        var leavingIds=(settings.todaysBatchIds||[]).filter(function(id){ return words[id]; });
        var leavingId=leavingIds[learnIndex];
        if(leavingId) markCardSeen(leavingId);
      }
      if(el.dataset.route!=="quiz" && el.dataset.route!=="review") quizSession=null;
      route=el.dataset.route;
      if(route==="learn"){ learnIndex=0; learnFlipped=false; }
      render();
    } else if(action==="flip-card"){
      var flipIds=(settings.todaysBatchIds||[]).filter(function(id){ return words[id]; });
      var flipId=flipIds[learnIndex];
      if(flipId) markCardSeen(flipId);
      learnFlipped=!learnFlipped; render();
    } else if(action==="learn-next"){
      var nextIds=(settings.todaysBatchIds||[]).filter(function(id){ return words[id]; });
      var nextCurId=nextIds[learnIndex];
      if(nextCurId) markCardSeen(nextCurId);
      learnIndex++; learnFlipped=false; render();
    } else if(action==="learn-prev"){
      learnIndex=Math.max(0,learnIndex-1); learnFlipped=false; render();
    } else if(action==="start-quiz"){
      startSession("quiz"); render();
    } else if(action==="start-review"){
      startSession("review"); render();
    } else if(action==="answer-mcq"){
      if(!quizSession.awaitingNext) submitAnswer(el.dataset.value);
    } else if(action==="next-question"){
      nextQuestion();
    } else if(action==="retry-wrong"){
      var wrongIds=quizSession.answers.filter(function(a){return !a.correct;}).map(function(a){return a.id;});
      var kind=quizSession.kind;
      startSession(kind, wrongIds);
      render();
    } else if(action==="finish-session"){
      quizSession=null; route="home"; render();
    } else if(action==="toggle-word-form"){
      wordFormOpen=!wordFormOpen; wordFormError=""; render();
    } else if(action==="autofill-word"){
      handleAutofillWord(el);
    } else if(action==="speak"){
      speak(el.dataset.word);
    } else if(action==="toggle-star"){
      toggleStar(el.dataset.id);
    } else if(action==="modal-noop"){
      /* keep clicks inside the modal card from bubbling to modal-cancel */
    } else if(action==="modal-cancel"){
      pendingConfirm=null; render();
    } else if(action==="modal-confirm"){
      var confirmed=pendingConfirm;
      pendingConfirm=null;
      if(confirmed && typeof confirmed.onConfirm==="function") confirmed.onConfirm();
      render();
    } else if(action==="stat-filter"){
      wordFilter=el.dataset.filter; wordCategoryFilter="all"; wordSearch=""; wordFormOpen=false;
      route="words"; render();
    } else if(action==="filter-words"){
      wordFilter=el.dataset.filter; render();
    } else if(action==="filter-category"){
      wordCategoryFilter=el.dataset.filter; render();
    } else if(action==="add-word"){
      addWordFromForm();
    } else if(action==="delete-word"){
      deleteWord(el.dataset.id);
    } else if(action==="daily-minus"){
      settings.dailyCount=Math.max(DAILY_MIN,(settings.dailyCount||10)-1);
      persistSettings(); render();
    } else if(action==="daily-plus"){
      settings.dailyCount=Math.min(DAILY_MAX,(settings.dailyCount||10)+1);
      persistSettings(); render();
    } else if(action==="reset-progress"){
      pendingConfirm={ message:"정말 모든 학습 진행 상황을 초기화할까요? 되돌릴 수 없어요.", onConfirm:resetProgress };
      render();
    }
  });

  document.addEventListener("input", function(e){
    if(e.target.id==="wordSearchInput"){
      wordSearch=e.target.value;
      document.getElementById("wordListContainer").innerHTML = wordListItemsHtml();
    }
  });

  document.addEventListener("submit", function(e){
    if(e.target && e.target.id==="typingForm"){
      e.preventDefault();
      var input=document.getElementById("typingInput");
      if(input && input.value.trim()!=="" && quizSession && !quizSession.awaitingNext) submitAnswer(input.value);
    }
  });

  /* ---------- boot ---------- */
  function start(){
    ensureTodayBatch();
    render();
  }

  render();
  loadAll().then(start).catch(function(){
    mode="local"; fallbackInit(); start();
  });
  initSample();
})();
</script>

</body></html>
